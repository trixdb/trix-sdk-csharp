name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Release configuration lives in release-please-config.json and
      # .release-please-manifest.json (v4 manifest mode), which the action reads
      # by default. Do not pass release-type/package-name inline: package-name is
      # not a valid v4 input, and an inline release-type shadows the config file
      # (dropping changelog-sections and the Trix.csproj version bump).
      #
      # NOTE: opening the release PR requires the repo/org setting "Allow GitHub
      # Actions to create and approve pull requests" to be enabled, or a PAT /
      # GitHub App token supplied here in place of the default GITHUB_TOKEN.
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Build and publish to NuGet
  publish-nuget:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/Trix/Trix.csproj --configuration Release --no-build --output ./nupkgs

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY secret is not set. Please add it in repository settings."
            exit 1
          fi
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  # Trigger docs rebuild
  trigger-docs-rebuild:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger trix-landing rebuild
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository_owner }}/trix-landing/dispatches \
            -d '{"event_type":"release-published","client_payload":{"repository":"trix-sdk-csharp","version":"${{ needs.release-please.outputs.tag_name }}"}}'
